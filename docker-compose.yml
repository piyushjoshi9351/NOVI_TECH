services:
  letta:
    # Pinned to the last "Python server" LettA image (the REST server on :8283 the
    # letta-client SDK targets). letta/letta:latest is now the LettA Code app which
    # no longer serves the /v1 REST API this app integration relies on.
    image: letta/letta:0.16.8
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - LETTA_PG_URI=postgresql://novi:novi@postgres:5432/letta
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novi-net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: novi
      POSTGRES_PASSWORD: novi
      POSTGRES_DB: letta
    volumes:
      - letta_pg_016_data:/var/lib/postgresql/data
      - ./pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novi -d letta"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - novi-net

  redis:
    image: redis:alpine
    networks:
      - novi-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novi_backend
    # Everything not explicitly overridden below (GOOGLE_CLIENT_ID,
    # GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI, GEMINI_API_KEY, FRONTEND_URL, ...)
    # is sourced from backend/.env so Google OAuth works identically in Docker
    # and when run natively. Explicit `environment` entries win over this file.
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - LETTA_BASE_URL=http://letta:8283
      - INTERNAL_CALLBACK_BASE_URL=http://backend:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - FRONTEND_URL=http://localhost:3000
    networks:
      - novi-net
    depends_on:
      redis:
        condition: service_started
      letta:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - novi-net

volumes:
  letta_pg_016_data:

networks:
  novi-net:
    driver: bridge
