services:
  letta:
    # Pinned to the last "Python server" LettA image (the REST server on :8283 the
    # letta-client SDK targets). letta/letta:latest is now the LettA Code app which
    # no longer serves the /v1 REST API this app integration relies on.
    image: letta/letta:0.16.8
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - LETTA_PG_URI=postgresql://novi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@postgres:5432/letta
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novi-net

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: novi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
      POSTGRES_DB: letta
    volumes:
      - letta_pg_016_data:/var/lib/postgresql/data
      - ./pg_init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novi -d letta"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - novi-net

  redis:
    image: redis:alpine
    networks:
      - novi-net

  mysql:
    image: mysql:8.0
    container_name: novi_mysql
    restart: unless-stopped
    # Published on host 3307 so it never clashes with a native MySQL on 3306.
    # backend/.env must point at 127.0.0.1:3307 when running the backend natively.
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novi_db}
    ports:
      - "3307:3306"
    volumes:
      - novi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h localhost -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - novi-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novi_backend
    # Everything not explicitly overridden below (GOOGLE_CLIENT_ID,
    # GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI, GEMINI_API_KEY, FRONTEND_URL, ...)
    # is sourced from backend/.env so Google OAuth works identically in Docker
    # and when run natively. Explicit `environment` entries win over this file.
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the root .env}
      - DB_NAME=${MYSQL_DATABASE:-novi_db}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LETTA_BASE_URL=http://letta:8283
      - INTERNAL_CALLBACK_BASE_URL=http://backend:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - FRONTEND_URL=http://localhost:3000
    networks:
      - novi-net
    depends_on:
      redis:
        condition: service_started
      letta:
        condition: service_started
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - novi-net

volumes:
  letta_pg_016_data:
  # Pre-existing MySQL data volume (created by an earlier `docker run`). Kept
  # external so the populated `novi_db` survives and compose just reuses it.
  novi_mysql_data:
    external: true
    name: 937dd5cba57369a11f8d5c1900f212ebc45443fc837a0c6d960e245dda319853

networks:
  novi-net:
    driver: bridge
